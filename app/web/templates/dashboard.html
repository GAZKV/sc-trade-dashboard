<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Citizen Trade Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  {% if ctx_json %}
  <script id="init-data" type="application/json">{{ ctx_json|safe }}</script>
  {% endif %}
</head>
<body>
  <div class="container-fluid">
  <header>
    <nav class="navbar navbar-dark d-flex w-100 position-relative">
      <ul class="navbar-nav flex-row">
        <li class="nav-item"><a class="nav-link" href="#pending">Pending</a></li>
        <li class="nav-item"><a class="nav-link" href="#buy-summary">Buys</a></li>
        <li class="nav-item"><a class="nav-link" href="#sell-summary">Sells</a></li>
        <li class="nav-item"><a class="nav-link" href="#best-routes">Routes</a></li>
        <li class="nav-item"><a class="nav-link" href="#last-transactions">Recent</a></li>
      </ul>
      <span class="navbar-brand mb-0 h1 position-absolute start-50 translate-middle-x">Star Citizen Trade Dashboard</span>
      <small id="last-update" class="ms-auto">waiting for data…</small>
      <small id="log-summary" class="ms-2"></small>
    </nav>
  </header>

  <!-- KPI cards -->
  <div class="row g-3">
    <div class="col-md-4">
      <div class="card kpi">
        <div class="card-body">
          <h2 class="card-title">Total Profit</h2>
          <p id="profit" class="card-text">–</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card kpi">
        <div class="card-body">
          <h2 class="card-title">Total Buys</h2>
          <p id="buys" class="card-text">–</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card kpi">
        <div class="card-body">
          <h2 class="card-title">Total Sells</h2>
          <p id="sells" class="card-text">–</p>
        </div>
      </div>
    </div>
    </div>
    <div class="neon-bar"></div>

    <!-- Chart -->
  <div class="row">
    <div class="col">
      <div class="chart-container">
        <canvas id="profitChart" class="chart" height="320"></canvas>
      </div>
    </div>
  </div>

  <!-- Tables -->
  <div id="tableTabsContainer" class="mt-4">
    <ul class="nav nav-tabs" id="tableTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending" type="button" role="tab">Pending</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="buy-summary-tab" data-bs-toggle="tab" data-bs-target="#buy-summary" type="button" role="tab">Buys</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="sell-summary-tab" data-bs-toggle="tab" data-bs-target="#sell-summary" type="button" role="tab">Sells</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="best-routes-tab" data-bs-toggle="tab" data-bs-target="#best-routes" type="button" role="tab">Routes</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="last-transactions-tab" data-bs-toggle="tab" data-bs-target="#last-transactions" type="button" role="tab">Recent</button>
      </li>
    </ul>
    <div class="tab-content pt-3" id="tables-tab-content">
      <div class="tab-pane fade show active" id="pending" role="tabpanel">
        <h2>Pending Inventory</h2>
        <table id="pendingTable" class="table table-dark table-striped table-hover"></table>
      </div>
      <div class="tab-pane fade" id="buy-summary" role="tabpanel">
        <h2>Buy Summary</h2>
        <table id="buyTable" class="table table-dark table-striped table-hover"></table>
      </div>
      <div class="tab-pane fade" id="sell-summary" role="tabpanel">
        <h2>Sell Summary</h2>
        <table id="sellTable" class="table table-dark table-striped table-hover"></table>
      </div>
      <div class="tab-pane fade" id="best-routes" role="tabpanel">
        <h2>Best Routes</h2>
        <table id="routeTable" class="table table-dark table-striped table-hover"></table>
      </div>
      <div class="tab-pane fade" id="last-transactions" role="tabpanel">
        <h2>Últimas Transacciones</h2>
        <table id="lastTransTable" class="table table-dark table-striped table-hover"></table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/main.js"></script>
</div>
</body>
</html>
